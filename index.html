<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Nova — AI Chat</title>

<!-- Tailwind CSS (CDN) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Lucide Icons (CDN) -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<!-- Marked.js — markdown → HTML -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- DOMPurify — sanitize rendered HTML to prevent XSS -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@1,400;1,500&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          canvas:   '#0a0a0b',
          surface:  '#131316',
          elevated: '#1b1b1f',
          hairline: '#28282d',
          accent:   '#c9a961',
          'accent-soft': '#c9a96122',
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          serif: ['Newsreader', 'serif'],
        }
      }
    }
  }
</script>

<style>
  html, body { height: 100%; background: #0a0a0b; }
  body { font-family: 'Inter', system-ui, sans-serif; }

  /* Thin, quiet scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333338; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #45454c; }

  /* Sidebar slide for mobile */
  #sidebar { transition: transform .25s ease; }
  @media (max-width: 767px) {
    #sidebar { position: fixed; inset: 0 auto 0 0; z-index: 40; transform: translateX(-100%); width: 280px; }
    #sidebar.open { transform: translateX(0); }
  }

  /* Composer auto-grow textarea */
  #composer-input {
    field-sizing: content;
    max-height: 200px;
  }

  /* Typing dots */
  .typing-dot { animation: bounce-dot 1.2s infinite ease-in-out; }
  .typing-dot:nth-child(2) { animation-delay: .15s; }
  .typing-dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce-dot {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Message fade-in */
  .msg-enter { animation: msg-in .25s ease both; }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Markdown content inside assistant messages */
  .prose-chat { color: #e4e4e7; line-height: 1.7; }
  .prose-chat p { margin: 0 0 .85em; }
  .prose-chat p:last-child { margin-bottom: 0; }
  .prose-chat ul, .prose-chat ol { margin: .5em 0 .85em; padding-left: 1.4em; }
  .prose-chat li { margin: .25em 0; }
  .prose-chat ul { list-style: disc; }
  .prose-chat ol { list-style: decimal; }
  .prose-chat a { color: #c9a961; text-decoration: underline; text-underline-offset: 2px; }
  .prose-chat strong { color: #f4f4f5; font-weight: 600; }
  .prose-chat h1, .prose-chat h2, .prose-chat h3 {
    color: #f4f4f5; font-weight: 600; margin: 1em 0 .5em; line-height: 1.3;
  }
  .prose-chat h1 { font-size: 1.3em; }
  .prose-chat h2 { font-size: 1.15em; }
  .prose-chat h3 { font-size: 1.05em; }
  .prose-chat blockquote {
    border-left: 3px solid #c9a961; padding-left: .9em; margin: .8em 0;
    color: #a1a1aa; font-style: italic;
  }
  .prose-chat code:not(pre code) {
    background: #232327; border: 1px solid #2f2f34; padding: .15em .4em;
    border-radius: 5px; font-size: .87em; color: #e2b876;
  }
  .prose-chat table { border-collapse: collapse; margin: .8em 0; font-size: .92em; width: 100%; }
  .prose-chat th, .prose-chat td { border: 1px solid #2f2f34; padding: .45em .7em; text-align: left; }
  .prose-chat th { background: #1c1c20; }

  /* Code block wrapper */
  .code-block { position: relative; margin: .9em 0; border-radius: 10px; overflow: hidden; border: 1px solid #2a2a2e; }
  .code-block-header {
    display: flex; align-items: center; justify-content: space-between;
    background: #18181b; padding: .45rem .8rem; font-size: .75rem; color: #9c9ca3;
    border-bottom: 1px solid #2a2a2e;
  }
  .code-block pre { margin: 0; padding: .9rem 1rem; overflow-x: auto; background: #0d0d0f; }
  .code-block code { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: .85rem; color: #e4e4e7; }
  .copy-btn {
    display: flex; align-items: center; gap: .3em; font-size: .75rem; color: #a1a1aa;
    padding: .2rem .5rem; border-radius: 6px; transition: background .15s, color .15s;
  }
  .copy-btn:hover { background: #26262b; color: #f4f4f5; }

  .suggestion-card:hover { border-color: #c9a96155; background: #17171a; }
  .history-item:hover .history-delete { opacity: 1; }
  .history-item.active { background: #1c1c20; }

  textarea::placeholder { color: #6b6b72; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>

<body class="bg-canvas text-zinc-100 antialiased h-screen overflow-hidden">

<div class="flex h-full">

  <!-- ============ MOBILE OVERLAY ============ -->
  <div id="overlay" class="hidden fixed inset-0 bg-black/60 z-30 md:hidden"></div>

  <!-- ============ SIDEBAR ============ -->
  <aside id="sidebar" class="w-[280px] shrink-0 bg-surface border-r border-hairline flex flex-col h-full">

    <!-- Brand + New chat -->
    <div class="p-3 space-y-1">
      <div class="flex items-center gap-2 px-2 py-2 mb-1">
        <div class="w-7 h-7 rounded-full bg-accent/15 border border-accent/40 flex items-center justify-center">
          <i data-lucide="sparkle" class="w-4 h-4 text-accent"></i>
        </div>
        <span class="font-semibold tracking-tight text-zinc-100">Nova</span>
      </div>

      <button id="new-chat-btn"
        class="w-full flex items-center gap-2 px-3 py-2.5 rounded-xl border border-hairline hover:bg-elevated transition-colors text-sm font-medium text-zinc-200">
        <i data-lucide="plus" class="w-4 h-4"></i>
        Chat Baru
      </button>
    </div>

    <!-- History -->
    <div class="flex-1 overflow-y-auto px-2 pb-2 space-y-0.5" id="history-list"></div>
  </aside>

  <!-- ============ MAIN AREA ============ -->
  <main class="flex-1 flex flex-col h-full min-w-0 relative">

    <!-- Top bar -->
    <header class="flex items-center justify-between gap-2 px-3 md:px-5 py-3 border-b border-hairline shrink-0">
      <div class="flex items-center gap-2 min-w-0">
        <button id="sidebar-toggle" class="md:hidden p-2 rounded-lg hover:bg-elevated shrink-0">
          <i data-lucide="panel-left" class="w-5 h-5 text-zinc-400"></i>
        </button>
        <span id="chat-title" class="text-sm font-medium text-zinc-300 truncate">Chat Baru</span>
      </div>

      <!-- Model selector -->
      <div class="relative shrink-0">
        <button id="model-btn"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-hairline hover:bg-elevated text-xs font-medium text-zinc-300 transition-colors">
          <i data-lucide="cpu" class="w-3.5 h-3.5 text-accent"></i>
          <span id="model-label">llama-3.3-70b-versatile</span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-zinc-500"></i>
        </button>
        <div id="model-dropdown"
          class="hidden absolute right-0 mt-2 w-64 bg-elevated border border-hairline rounded-xl shadow-2xl shadow-black/50 py-1.5 z-20">
        </div>
      </div>
    </header>

    <!-- Messages / welcome screen -->
    <div id="scroll-area" class="flex-1 overflow-y-auto">
      <div id="welcome-screen" class="h-full flex flex-col items-center justify-center px-4 text-center">
        <div class="w-12 h-12 rounded-full bg-accent/10 border border-accent/30 flex items-center justify-center mb-5">
          <i data-lucide="sparkle" class="w-6 h-6 text-accent"></i>
        </div>
        <h1 class="font-serif italic text-3xl md:text-4xl text-zinc-100 mb-2">Mulai percakapan</h1>
        <p class="text-zinc-500 text-sm mb-8 max-w-sm">Tanyakan apa saja — Nova mengingat konteks obrolan Anda.</p>

        <div id="suggestion-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 w-full max-w-lg">
          <!-- filled by JS -->
        </div>
      </div>

      <div id="messages" class="hidden max-w-3xl mx-auto w-full px-4 md:px-6 py-6 space-y-6"></div>
    </div>

    <!-- Composer -->
    <div class="shrink-0 px-3 md:px-6 pb-4 pt-2">
      <div class="max-w-3xl mx-auto">
        <div id="error-banner" class="hidden mb-2 flex items-start gap-2 text-xs text-red-300 bg-red-950/40 border border-red-900/60 rounded-xl px-3 py-2.5"></div>

        <form id="composer-form"
          class="flex items-end gap-2 bg-surface border border-hairline focus-within:border-accent/50 rounded-[28px] px-2 py-2 shadow-lg shadow-black/20 transition-colors">
          <textarea id="composer-input" rows="1" placeholder="Kirim pesan ke Nova..."
            class="flex-1 bg-transparent resize-none outline-none text-sm text-zinc-100 placeholder-zinc-600 px-3 py-2 max-h-48"></textarea>
          <button type="submit" id="send-btn"
            class="w-9 h-9 shrink-0 rounded-full bg-accent hover:bg-accent/90 disabled:bg-zinc-700 disabled:cursor-not-allowed flex items-center justify-center transition-colors">
            <i data-lucide="arrow-up" class="w-4.5 h-4.5 text-black"></i>
          </button>
        </form>
        <p class="text-center text-[11px] text-zinc-600 mt-2">Nova dapat membuat kesalahan. Periksa info penting.</p>
      </div>
    </div>
  </main>
</div>

<script>
/* =========================================================================
   CONFIG
   ========================================================================= */
/**
 * ⚠️ WAJIB DIISI SEBELUM DEPLOY ⚠️
 * Tempelkan URL Cloudflare Worker Anda (proxy ke Groq API) di sini,
 * lalu unggah file ini ke GitHub Pages. Contoh: "https://nova-proxy.username.workers.dev"
 * Worker harus menerima POST { model, messages } dan mengembalikan
 * JSON berbentuk { choices: [{ message: { content: "..." } }] } (format Groq/OpenAI).
 */
const WORKER_URL = "MASUKKAN_URL_CLOUDFLARE_WORKER_DI_SINI";

const AVAILABLE_MODELS = [
  { id: 'llama-3.3-70b-versatile', label: 'Llama 3.3 70B Versatile', desc: 'Paling pintar, cocok untuk tugas kompleks' },
  { id: 'llama3-8b-8192',          label: 'Llama 3 8B',              desc: 'Cepat & ringan' },
  { id: 'mixtral-8x7b-32768',      label: 'Mixtral 8x7B',            desc: 'Context window besar' },
];
const MAX_HISTORY_MESSAGES = 10;   // last N messages sent as context
const STORAGE_KEY_CHATS  = 'nova_chats_v1';
const STORAGE_KEY_MODEL  = 'nova_model';

const SUGGESTIONS = [
  { icon: 'lightbulb',  text: 'Jelaskan konsep rekursi dengan contoh sederhana' },
  { icon: 'file-text',  text: 'Buatkan draft email profesional untuk klien' },
  { icon: 'code',       text: 'Bantu saya debug kode JavaScript' },
  { icon: 'compass',    text: 'Rencanakan itinerary liburan 3 hari' },
];

/* =========================================================================
   STATE
   ========================================================================= */
let chats = [];            // [{ id, title, model, messages: [{role, content}], createdAt }]
let currentChatId = null;
let selectedModel = AVAILABLE_MODELS[0].id;
let isSending = false;

/* =========================================================================
   UTILS
   ========================================================================= */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function saveChatsToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(chats));
  } catch (e) {
    console.error('Gagal menyimpan riwayat chat:', e);
  }
}

function loadChatsFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_CHATS);
    chats = raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error('Gagal memuat riwayat chat:', e);
    chats = [];
  }
}

function getCurrentChat() {
  return chats.find(c => c.id === currentChatId) || null;
}

/** Render markdown safely: marked -> DOMPurify -> DOM, with code blocks wrapped in copy UI */
function renderMarkdownSafe(rawText) {
  const dirtyHtml = marked.parse(rawText, { breaks: true });
  const cleanHtml = DOMPurify.sanitize(dirtyHtml, {
    ALLOWED_TAGS: ['p','br','strong','em','ul','ol','li','a','code','pre','blockquote',
                   'h1','h2','h3','h4','table','thead','tbody','tr','th','td','hr','img','span'],
    ALLOWED_ATTR: ['href','target','rel','src','alt','class']
  });
  return cleanHtml;
}

/** After inserting markdown HTML, upgrade every <pre><code> into a styled block with a copy button */
function enhanceCodeBlocks(container) {
  container.querySelectorAll('pre').forEach(pre => {
    if (pre.closest('.code-block')) return; // already enhanced
    const codeEl = pre.querySelector('code');
    const langMatch = codeEl && codeEl.className.match(/language-(\w+)/);
    const lang = langMatch ? langMatch[1] : 'text';

    const wrapper = document.createElement('div');
    wrapper.className = 'code-block';

    const header = document.createElement('div');
    header.className = 'code-block-header';
    header.innerHTML = `
      <span>${lang}</span>
      <button class="copy-btn" type="button">
        <i data-lucide="copy" class="w-3.5 h-3.5"></i><span>Copy</span>
      </button>`;

    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(header);
    wrapper.appendChild(pre);

    header.querySelector('.copy-btn').addEventListener('click', () => {
      const text = codeEl ? codeEl.textContent : pre.textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = header.querySelector('.copy-btn span');
        const original = btn.textContent;
        btn.textContent = 'Disalin!';
        setTimeout(() => { btn.textContent = original; }, 1500);
      });
    });
  });
  if (window.lucide) lucide.createIcons();
}

function scrollToBottom() {
  const area = document.getElementById('scroll-area');
  area.scrollTop = area.scrollHeight;
}

/* =========================================================================
   RENDER: SIDEBAR HISTORY
   ========================================================================= */
function renderHistoryList() {
  const list = document.getElementById('history-list');
  list.innerHTML = '';

  const sorted = [...chats].sort((a, b) => b.createdAt - a.createdAt);

  if (sorted.length === 0) {
    list.innerHTML = `<p class="text-xs text-zinc-600 px-3 py-4 text-center">Belum ada riwayat chat</p>`;
    return;
  }

  sorted.forEach(chat => {
    const item = document.createElement('div');
    item.className = `history-item group flex items-center gap-2 px-3 py-2.5 rounded-lg cursor-pointer text-sm text-zinc-400 hover:bg-elevated transition-colors ${chat.id === currentChatId ? 'active text-zinc-100' : ''}`;
    item.innerHTML = `
      <i data-lucide="message-square" class="w-3.5 h-3.5 shrink-0 opacity-60"></i>
      <span class="truncate flex-1">${escapeHtml(chat.title || 'Chat baru')}</span>
      <button class="history-delete opacity-0 group-hover:opacity-100 transition-opacity p-1 hover:text-red-400 shrink-0" title="Hapus">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
      </button>`;
    item.addEventListener('click', (e) => {
      if (e.target.closest('.history-delete')) return;
      switchToChat(chat.id);
    });
    item.querySelector('.history-delete').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteChat(chat.id);
    });
    list.appendChild(item);
  });

  if (window.lucide) lucide.createIcons();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* =========================================================================
   RENDER: MESSAGES
   ========================================================================= */
function renderMessages() {
  const chat = getCurrentChat();
  const welcome = document.getElementById('welcome-screen');
  const box = document.getElementById('messages');
  const title = document.getElementById('chat-title');

  if (!chat || chat.messages.length === 0) {
    welcome.classList.remove('hidden');
    box.classList.add('hidden');
    box.innerHTML = '';
    title.textContent = 'Chat Baru';
    return;
  }

  welcome.classList.add('hidden');
  box.classList.remove('hidden');
  box.innerHTML = '';
  title.textContent = chat.title || 'Chat Baru';

  chat.messages.forEach(msg => box.appendChild(buildMessageEl(msg.role, msg.content)));
  enhanceCodeBlocks(box);
  scrollToBottom();
}

function buildMessageEl(role, content) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-enter flex gap-3 ' + (role === 'user' ? 'justify-end' : 'justify-start');

  if (role === 'user') {
    wrap.innerHTML = `
      <div class="max-w-[80%] bg-elevated border border-hairline rounded-2xl rounded-tr-md px-4 py-2.5 text-sm text-zinc-100 whitespace-pre-wrap break-words">
        ${escapeHtml(content)}
      </div>`;
  } else {
    const bubble = document.createElement('div');
    bubble.className = 'max-w-[85%] flex gap-3';
    bubble.innerHTML = `
      <div class="w-7 h-7 shrink-0 rounded-full bg-accent/15 border border-accent/40 flex items-center justify-center mt-0.5">
        <i data-lucide="sparkle" class="w-3.5 h-3.5 text-accent"></i>
      </div>
      <div class="prose-chat text-sm pt-0.5">${renderMarkdownSafe(content)}</div>`;
    wrap.appendChild(bubble);
    return wrap;
  }
  return wrap;
}

/** Typing-reveal effect for a freshly-arrived assistant response */
function typeOutAssistantMessage(fullText, onDone) {
  const box = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-enter flex gap-3 justify-start';
  wrap.innerHTML = `
    <div class="max-w-[85%] flex gap-3">
      <div class="w-7 h-7 shrink-0 rounded-full bg-accent/15 border border-accent/40 flex items-center justify-center mt-0.5">
        <i data-lucide="sparkle" class="w-3.5 h-3.5 text-accent"></i>
      </div>
      <div class="prose-chat text-sm pt-0.5"><span class="reveal-target"></span></div>
    </div>`;
  box.appendChild(wrap);
  if (window.lucide) lucide.createIcons();

  const target = wrap.querySelector('.reveal-target');
  const fullHtml = renderMarkdownSafe(fullText);

  // For a lightweight "typing" feel without re-parsing markdown every frame,
  // reveal the plain text quickly, then swap in the final rendered markdown.
  let i = 0;
  const step = Math.max(1, Math.ceil(fullText.length / 120)); // ~120 animation ticks max
  const interval = setInterval(() => {
    i += step;
    target.textContent = fullText.slice(0, i);
    scrollToBottom();
    if (i >= fullText.length) {
      clearInterval(interval);
      wrap.querySelector('.prose-chat').innerHTML = fullHtml;
      enhanceCodeBlocks(wrap);
      scrollToBottom();
      if (onDone) onDone();
    }
  }, 12);
}

function showTypingIndicator() {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.id = 'typing-indicator';
  el.className = 'msg-enter flex gap-3 justify-start';
  el.innerHTML = `
    <div class="w-7 h-7 shrink-0 rounded-full bg-accent/15 border border-accent/40 flex items-center justify-center mt-0.5">
      <i data-lucide="sparkle" class="w-3.5 h-3.5 text-accent"></i>
    </div>
    <div class="flex items-center gap-1.5 px-1 py-3">
      <span class="typing-dot w-1.5 h-1.5 rounded-full bg-zinc-500"></span>
      <span class="typing-dot w-1.5 h-1.5 rounded-full bg-zinc-500"></span>
      <span class="typing-dot w-1.5 h-1.5 rounded-full bg-zinc-500"></span>
    </div>`;
  box.appendChild(el);
  if (window.lucide) lucide.createIcons();
  scrollToBottom();
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

/* =========================================================================
   RENDER: WELCOME SUGGESTIONS
   ========================================================================= */
function renderSuggestions() {
  const grid = document.getElementById('suggestion-grid');
  grid.innerHTML = '';
  SUGGESTIONS.forEach(s => {
    const card = document.createElement('button');
    card.className = 'suggestion-card text-left flex items-start gap-2.5 p-3.5 rounded-xl border border-hairline bg-surface hover:bg-elevated transition-colors';
    card.innerHTML = `
      <i data-lucide="${s.icon}" class="w-4 h-4 text-accent mt-0.5 shrink-0"></i>
      <span class="text-xs text-zinc-300 leading-relaxed">${escapeHtml(s.text)}</span>`;
    card.addEventListener('click', () => {
      document.getElementById('composer-input').value = s.text;
      handleSendMessage();
    });
    grid.appendChild(card);
  });
  if (window.lucide) lucide.createIcons();
}

/* =========================================================================
   RENDER: MODEL DROPDOWN
   ========================================================================= */
function renderModelDropdown() {
  const dropdown = document.getElementById('model-dropdown');
  dropdown.innerHTML = '';
  AVAILABLE_MODELS.forEach(m => {
    const item = document.createElement('button');
    item.className = 'w-full text-left px-3.5 py-2.5 hover:bg-canvas/60 flex flex-col gap-0.5 transition-colors' +
      (m.id === selectedModel ? ' bg-canvas/40' : '');
    item.innerHTML = `
      <span class="text-xs font-medium text-zinc-100 flex items-center gap-1.5">
        ${m.id === selectedModel ? '<i data-lucide="check" class="w-3.5 h-3.5 text-accent"></i>' : '<span class="w-3.5"></span>'}
        ${escapeHtml(m.label)}
      </span>
      <span class="text-[11px] text-zinc-500 pl-5">${escapeHtml(m.desc)}</span>`;
    item.addEventListener('click', () => {
      selectedModel = m.id;
      localStorage.setItem(STORAGE_KEY_MODEL, selectedModel);
      document.getElementById('model-label').textContent = m.id;
      dropdown.classList.add('hidden');
      renderModelDropdown();
    });
    dropdown.appendChild(item);
  });
  if (window.lucide) lucide.createIcons();
}

/* =========================================================================
   CHAT LOGIC
   ========================================================================= */
function createNewChat() {
  const chat = { id: uid(), title: '', model: selectedModel, messages: [], createdAt: Date.now() };
  chats.push(chat);
  currentChatId = chat.id;
  saveChatsToStorage();
  renderHistoryList();
  renderMessages();
  closeSidebarOnMobile();
  document.getElementById('composer-input').focus();
}

function switchToChat(id) {
  currentChatId = id;
  const chat = getCurrentChat();
  if (chat) selectedModel = chat.model || selectedModel;
  document.getElementById('model-label').textContent = selectedModel;
  renderHistoryList();
  renderMessages();
  closeSidebarOnMobile();
}

function deleteChat(id) {
  chats = chats.filter(c => c.id !== id);
  saveChatsToStorage();
  if (currentChatId === id) {
    currentChatId = chats.length ? chats[0].id : null;
    if (!currentChatId) createNewChat();
  }
  renderHistoryList();
  renderMessages();
}

function closeSidebarOnMobile() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.add('hidden');
}

function showError(message) {
  const banner = document.getElementById('error-banner');
  banner.innerHTML = `<i data-lucide="alert-triangle" class="w-4 h-4 shrink-0 mt-0.5"></i><span>${escapeHtml(message)}</span>`;
  banner.classList.remove('hidden');
  if (window.lucide) lucide.createIcons();
}

function clearError() {
  document.getElementById('error-banner').classList.add('hidden');
}

async function handleSendMessage() {
  const input = document.getElementById('composer-input');
  const text = input.value.trim();
  if (!text || isSending) return;

  clearError();

  if (!WORKER_URL || WORKER_URL === "MASUKKAN_URL_CLOUDFLARE_WORKER_DI_SINI") {
    showError('WORKER_URL belum diisi di dalam kode. Buka index.html dan tempelkan URL Cloudflare Worker Anda pada konstanta WORKER_URL di bagian atas skrip.');
    return;
  }

  let chat = getCurrentChat();
  if (!chat) {
    chat = { id: uid(), title: '', model: selectedModel, messages: [], createdAt: Date.now() };
    chats.push(chat);
    currentChatId = chat.id;
  }

  // Set chat title from first message
  if (!chat.title) {
    chat.title = text.length > 40 ? text.slice(0, 40) + '…' : text;
  }

  chat.messages.push({ role: 'user', content: text });
  saveChatsToStorage();
  renderHistoryList();
  renderMessages();

  input.value = '';
  input.style.height = 'auto';

  isSending = true;
  document.getElementById('send-btn').disabled = true;
  showTypingIndicator();

  try {
    const contextMessages = chat.messages.slice(-MAX_HISTORY_MESSAGES);

    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: selectedModel,
        messages: contextMessages,
      }),
    });

    if (!response.ok) {
      const errText = await response.text().catch(() => '');
      throw new Error(`Worker merespons dengan status ${response.status}. ${errText ? '(' + errText.slice(0, 150) + ')' : ''}`);
    }

    const data = await response.json();

    // Support both OpenAI/Groq-style { choices: [{ message: { content } }] }
    // and a simpler { content: "..." } / { message: "..." } shape.
    const replyText =
      data?.choices?.[0]?.message?.content ??
      data?.content ??
      data?.message ??
      null;

    if (!replyText) {
      throw new Error('Format respons dari Worker tidak dikenali. Pastikan Worker mengembalikan field "choices[0].message.content".');
    }

    removeTypingIndicator();
    typeOutAssistantMessage(replyText, () => {
      chat.messages.push({ role: 'assistant', content: replyText });
      saveChatsToStorage();
      renderHistoryList();
    });

  } catch (err) {
    console.error(err);
    removeTypingIndicator();
    showError(
      err.message.includes('Failed to fetch')
        ? 'Tidak dapat terhubung ke Worker. Periksa URL Worker dan koneksi internet Anda.'
        : err.message || 'Terjadi kesalahan tak terduga saat menghubungi Worker.'
    );
  } finally {
    isSending = false;
    document.getElementById('send-btn').disabled = false;
  }
}

/* =========================================================================
   EVENT LISTENERS
   ========================================================================= */
document.getElementById('composer-form').addEventListener('submit', (e) => {
  e.preventDefault();
  handleSendMessage();
});

document.getElementById('composer-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSendMessage();
  }
});

document.getElementById('new-chat-btn').addEventListener('click', createNewChat);

document.getElementById('sidebar-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.remove('hidden');
});
document.getElementById('overlay').addEventListener('click', closeSidebarOnMobile);

document.getElementById('model-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('model-dropdown').classList.toggle('hidden');
});
document.addEventListener('click', () => {
  document.getElementById('model-dropdown').classList.add('hidden');
});

/* =========================================================================
   INIT
   ========================================================================= */
function init() {
  if (window.lucide) lucide.createIcons();

  loadChatsFromStorage();
  selectedModel = localStorage.getItem(STORAGE_KEY_MODEL) || AVAILABLE_MODELS[0].id;
  document.getElementById('model-label').textContent = selectedModel;

  renderModelDropdown();
  renderSuggestions();

  if (chats.length > 0) {
    currentChatId = [...chats].sort((a, b) => b.createdAt - a.createdAt)[0].id;
  } else {
    currentChatId = null;
  }

  renderHistoryList();
  renderMessages();
}

init();
</script>
</body>
</html>
