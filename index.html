<style>
  html, body { height: 100%; background: #FFFFFF; }
  body { height: 100vh; height: 100dvh; font-family: 'Inter', system-ui, sans-serif; }

  :root { box-sizing: border-box; }
  ::selection { background: #F0E2B8; color: #1C1917; }

  header#topbar {
    padding-top: calc(0.75rem + env(safe-area-inset-top, 0px));
  }
  #composer-wrap {
    padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
  }

  @media (max-width: 767px) {
    #sidebar { padding-top: env(safe-area-inset-top, 0px); }
    #sidebar-toggle { padding: 0.625rem; }
    #send-btn { width: 2.5rem; height: 2.5rem; }
    #composer-input { font-size: 16px; }
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #DDD3B8; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #C9BC9C; }

  #sidebar { transition: transform .25s ease; }
  @media (max-width: 767px) {
    #sidebar { position: fixed; inset: 0 auto 0 0; z-index: 40; transform: translateX(-100%); width: 280px; }
    #sidebar.open { transform: translateX(0); box-shadow: 0 0 48px rgba(28, 25, 23, .14); }
  }

  #composer-input {
    field-sizing: content;
    max-height: 200px;
  }

  button:focus-visible { outline: 2px solid #A47E26; outline-offset: 2px; }

  .typing-dot { animation: bounce-dot 1.2s infinite ease-in-out; }
  .typing-dot:nth-child(2) { animation-delay: .15s; }
  .typing-dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce-dot {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .msg-enter { animation: msg-in .25s ease both; }
  @keyframes msg-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .stream-cursor { display: inline-block; animation: blink-cursor 1s step-start infinite; color: #A47E26; }
  @keyframes blink-cursor { 50% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .msg-enter, .typing-dot, .stream-cursor { animation: none; }
    #sidebar { transition: none; }
  }

  .prose-chat { color: #2B2620; line-height: 1.7; overflow-wrap: anywhere; }
  .prose-chat p { margin: 0 0 .85em; }
  .prose-chat p:last-child { margin-bottom: 0; }
  .prose-chat ul, .prose-chat ol { margin: .5em 0 .85em; padding-left: 1.4em; }
  .prose-chat li { margin: .25em 0; }
  .prose-chat ul { list-style: disc; }
  .prose-chat ol { list-style: decimal; }
  .prose-chat a { color: #7A5B12; text-decoration: underline; text-underline-offset: 2px; }
  .prose-chat strong { color: #1C1917; font-weight: 600; }
  .prose-chat img { max-width: 100%; height: auto; border-radius: 8px; }
  .prose-chat h1, .prose-chat h2, .prose-chat h3 {
    color: #1C1917; font-weight: 600; margin: 1em 0 .5em; line-height: 1.3;
  }
  .prose-chat h1 { font-size: 1.3em; }
  .prose-chat h2 { font-size: 1.15em; }
  .prose-chat h3 { font-size: 1.05em; }
  .prose-chat blockquote {
    border-left: 3px solid #C5A153; padding-left: .9em; margin: .8em 0;
    color: #6B645A; font-style: italic;
  }
  .prose-chat code:not(pre code) {
    background: #F8F3E4; border: 1px solid #E9E0C6; padding: .15em .4em;
    border-radius: 5px; font-size: .87em; color: #7A5B12;
  }
  .prose-chat table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: .8em 0; font-size: .92em; }
  .prose-chat th, .prose-chat td { border: 1px solid #E9E2D0; padding: .45em .7em; text-align: left; }
  .prose-chat th { background: #F8F5EC; }
  .prose-chat hr { border: 0; border-top: 1px solid #E9E2D0; margin: 1.2em 0; }

  .code-block { position: relative; margin: .9em 0; border-radius: 10px; overflow: hidden; border: 1px solid #E9E2D0; }
  .code-block-header {
    display: flex; align-items: center; justify-content: space-between;
    background: #F6F2E7; padding: .45rem .8rem; font-size: .75rem; color: #6B645A;
    border-bottom: 1px solid #E9E2D0;
  }
  .code-block pre { margin: 0; padding: .9rem 1rem; overflow-x: auto; background: #FCFBF7; }
  .code-block code { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: .85rem; color: #2B2620; }
  .copy-btn {
    display: flex; align-items: center; gap: .3em; font-size: .75rem; color: #6B645A;
    padding: .2rem .5rem; border-radius: 6px; transition: background .15s, color .15s;
  }
  .copy-btn:hover { background: #EDE6D2; color: #1C1917; }

  .suggestion-card:hover { border-color: rgba(197, 161, 83, .6); background: #FAF5E6; }
  .history-item:hover .history-delete,
  .history-item:hover .history-rename,
  .history-item:hover .history-pin { opacity: 1; }
  .history-item.active { background: #F4F0E5; box-shadow: inset 2px 0 0 #C5A153; }
  @media (hover: none) {
    .history-item .history-delete,
    .history-item .history-rename,
    .history-item .history-pin { opacity: 1; }
  }

  textarea::placeholder { color: #948C7E; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  .msg-action-btn { transition: color .15s; }
  #mic-btn.recording { color: #DC2626; }

  /* ---------- Dark theme ---------- */
  html.dark, html.dark body { background: #14120F; }
  html.dark .bg-canvas { background-color: #14120F; }
  html.dark .bg-surface { background-color: #1B1815; }
  html.dark .bg-elevated { background-color: #24201A; }
  html.dark .bg-tint { background-color: #2A2316; }
  html.dark .bg-white { background-color: #1F1B16; }
  html.dark .bg-white\/85 { background-color: rgba(20,18,15,.85); }
  html.dark .border-hairline { border-color: #35301F; }
  html.dark .text-ink { color: #F3EEE3; }
  html.dark .text-muted { color: #B7AD98; }
  html.dark .text-faint { color: #8B816D; }
  html.dark #sidebar { background-color: #1B1815; }
  html.dark .prose-chat { color: #E9E2D0; }
  html.dark .prose-chat strong { color: #F3EEE3; }
  html.dark .prose-chat code:not(pre code) { background: #2A2316; border-color: #3C3520; color: #E4C77C; }
  html.dark .prose-chat th { background: #24201A; }
  html.dark .prose-chat th, html.dark .prose-chat td { border-color: #35301F; }
  html.dark .code-block { border-color: #35301F; }
  html.dark .code-block-header { background: #201C15; border-color: #35301F; color: #B7AD98; }
  html.dark .code-block pre { background: #171410; }
  html.dark .code-block code { color: #E9E2D0; }
  html.dark .copy-btn:hover { background: #2A2316; color: #F3EEE3; }
  html.dark .suggestion-card:hover { background: #24201A; }
  html.dark .history-item.active { background: #24201A; }
  html.dark textarea::placeholder { color: #6E6552; }
  html.dark #error-banner { background: #2A1414; border-color: #4A1F1F; color: #F3A6A6; }
  html.dark ::-webkit-scrollbar-thumb { background: #3C3625; }
  html.dark ::-webkit-scrollbar-thumb:hover { background: #4A432D; }
</style>
</head>

<body class="bg-canvas text-ink antialiased overflow-hidden">

<div class="flex h-full">

  <div id="overlay" class="hidden fixed inset-0 bg-stone-900/30 z-30 md:hidden"></div>

  <aside id="sidebar" class="w-[280px] shrink-0 bg-surface border-r border-hairline flex flex-col h-full">

    <div class="p-3 space-y-1">
      <div class="flex items-center gap-2 px-2 py-2 mb-1">
        <div class="w-7 h-7 rounded-full bg-accent/10 border border-accent/40 flex items-center justify-center overflow-hidden p-1">
          <img data-logo alt="BAS.ai" class="w-full h-full object-contain" />
        </div>
        <span class="font-semibold tracking-tight text-ink">BAS.ai</span>
      </div>

      <button id="new-chat-btn"
        class="w-full flex items-center gap-2 px-3 py-2.5 rounded-xl border border-hairline bg-white hover:border-accent/60 hover:bg-tint transition-colors text-sm font-medium text-ink">
        <i data-lucide="plus" class="w-4 h-4 text-accent-deep"></i>
        Chat Baru
      </button>

      <div class="relative">
        <i data-lucide="search" class="w-3.5 h-3.5 text-faint absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        <input id="history-search" type="search" placeholder="Cari riwayat chat..."
          class="w-full bg-white border border-hairline rounded-xl pl-8 pr-3 py-2 text-xs text-ink placeholder-faint outline-none focus:border-accent/60" />
      </div>
    </div>

    <div class="flex-1 overflow-y-auto px-2 pb-2 space-y-0.5" id="history-list"></div>
  </aside>

  <main class="flex-1 flex flex-col h-full min-w-0 relative">

    <header id="topbar" class="flex items-center justify-between gap-2 px-3 md:px-5 py-3 border-b border-hairline shrink-0 sticky top-0 z-10 bg-white/85 backdrop-blur-md">
      <div class="flex items-center gap-2 min-w-0">
        <button id="sidebar-toggle" aria-label="Buka riwayat chat" class="md:hidden p-2 rounded-lg hover:bg-elevated shrink-0">
          <i data-lucide="panel-left" class="w-5 h-5 text-muted"></i>
        </button>
        <span id="chat-title" title="Klik untuk ganti judul chat" class="text-sm font-medium text-ink truncate cursor-pointer hover:text-accent-deep">Chat Baru</span>
      </div>

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function saveChatsToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(chats));
  } catch (e) {
    console.error('Gagal menyimpan riwayat chat:', e);
  }
}

function loadChatsFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_CHATS);
    chats = raw ? JSON.parse(raw) : [];
    chats.forEach(c => {
      if (!Array.isArray(c.messages)) c.messages = [];
      if (typeof c.pinned !== 'boolean') c.pinned = false;
      c.messages.forEach(m => { if (!Array.isArray(m.attachments)) m.attachments = []; });
    });
  } catch (e) {
    console.error('Gagal memuat riwayat chat:', e);
    chats = [];
  }
}

function getCurrentChat() {
  return chats.find(c => c.id === currentChatId) || null;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

function assistantAvatarHtml() {
  return `
    <div class="w-7 h-7 shrink-0 rounded-full bg-accent/10 border border-accent/40 flex items-center justify-center mt-0.5 overflow-hidden p-1">
      <img src="${LOGO_SRC}" alt="BAS.ai" class="w-full h-full object-contain" />
    </div>`;
}

function renderMarkdownSafe(rawText) {
  const dirtyHtml = marked.parse(rawText || '', { breaks: true });
  const cleanHtml = DOMPurify.sanitize(dirtyHtml, {
    ALLOWED_TAGS: ['p','br','strong','em','ul','ol','li','a','code','pre','blockquote',
                   'h1','h2','h3','h4','table','thead','tbody','tr','th','td','hr','img','span'],
    ALLOWED_ATTR: ['href','target','rel','src','alt','class']
  });
  return cleanHtml;
}

function enhanceCodeBlocks(container) {
  container.querySelectorAll('pre').forEach(pre => {
    if (pre.closest('.code-block')) return;
    const codeEl = pre.querySelector('code');
    const langMatch = codeEl && codeEl.className.match(/language-(\w+)/);
    const lang = langMatch ? langMatch[1] : 'text';

    const wrapper = document.createElement('div');
    wrapper.className = 'code-block';

    const header = document.createElement('div');
    header.className = 'code-block-header';
    header.innerHTML = `
      <span>${lang}</span>
      <button class="copy-btn" type="button">
        <i data-lucide="copy" class="w-3.5 h-3.5"></i><span>Copy</span>
      </button>`;

    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(header);
    wrapper.appendChild(pre);

    header.querySelector('.copy-btn').addEventListener('click', () => {
      const text = codeEl ? codeEl.textContent : pre.textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = header.querySelector('.copy-btn span');
        const original = btn.textContent;
        btn.textContent = 'Disalin!';
        setTimeout(() => { btn.textContent = original; }, 1500);
      });
    });
  });
  if (window.lucide) lucide.createIcons();
}

function scrollToBottom() {
  const area = document.getElementById('scroll-area');
  area.scrollTop = area.scrollHeight;
}

function scrollIfNearBottom() {
  const area = document.getElementById('scroll-area');
  const threshold = 140;
  if (area.scrollHeight - area.scrollTop - area.clientHeight < threshold) {
    area.scrollTop = area.scrollHeight;
  }
}

function getReplyContainer() {
  return replySlot && replySlot.isConnected ? replySlot : document.getElementById('messages');
}

function prepareReplyView(box) {
  const area = document.getElementById('scroll-area');
  const anchor = box.lastElementChild;
  if (!anchor) return;

  replySlot = document.createElement('div');
  replySlot.id = 'reply-slot';
  box.appendChild(replySlot);

  const slotGap = parseFloat(getComputedStyle(replySlot).marginTop) || 0;
  const boxPaddingBottom = parseFloat(getComputedStyle(box).paddingBottom) || 0;
  const minHeight = area.clientHeight - REPLY_TOP_GAP - anchor.offsetHeight - slotGap - boxPaddingBottom;
  replySlot.style.minHeight = Math.max(0, minHeight) + 'px';

  const areaTop = area.getBoundingClientRect().top;
  const anchorTop = anchor.getBoundingClientRect().top;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  area.scrollTo({
    top: Math.max(0, area.scrollTop + (anchorTop - areaTop) - REPLY_TOP_GAP),
    behavior: reduceMotion ? 'auto' : 'smooth'
  });
}

function historySectionLabel(text) {
  const el = document.createElement('div');
  el.className = 'px-3 pt-3 pb-1 text-[10px] font-semibold uppercase tracking-wider text-faint';
  el.textContent = text;
  return el;
}

function buildHistoryItem(chat) {
  const item = document.createElement('div');
  item.className = `history-item group flex items-center gap-1.5 px-3 py-2.5 rounded-lg cursor-pointer text-sm hover:bg-elevated transition-colors ${chat.id === currentChatId ? 'active text-ink' : 'text-muted'}`;
  item.innerHTML = `
    <i data-lucide="message-square" class="w-3.5 h-3.5 shrink-0 opacity-60"></i>
    <span class="truncate flex-1">${escapeHtml(chat.title || 'Chat baru')}</span>
    <button class="history-pin ${chat.pinned ? 'opacity-100 text-accent-deep' : 'opacity-0'} transition-opacity p-1.5 shrink-0" title="${chat.pinned ? 'Lepas sematan' : 'Sematkan chat'}" aria-label="Sematkan chat">
      <i data-lucide="pin" class="w-3.5 h-3.5"></i>
    </button>
    <button class="history-rename opacity-0 transition-opacity p-1.5 shrink-0" title="Ganti judul" aria-label="Ganti judul chat">
      <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
    </button>
    <button class="history-delete opacity-0 transition-opacity p-1.5 -mr-1 hover:text-red-600 shrink-0" title="Hapus" aria-label="Hapus chat">
      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
    </button>`;
  item.addEventListener('click', (e) => {
    if (e.target.closest('.history-delete, .history-pin, .history-rename')) return;
    switchToChat(chat.id);
  });
  item.querySelector('.history-delete').addEventListener('click', (e) => {
    e.stopPropagation();
    deleteChat(chat.id);
  });
  item.querySelector('.history-pin').addEventListener('click', (e) => {
    e.stopPropagation();
    togglePinChat(chat.id);
  });
  item.querySelector('.history-rename').addEventListener('click', (e) => {
    e.stopPropagation();
    renameChat(chat.id);
  });
  return item;
}

function renderHistoryList() {
  const list = document.getElementById('history-list');
  const searchEl = document.getElementById('history-search');
  const query = (searchEl ? searchEl.value : '').trim().toLowerCase();
  list.innerHTML = '';

  let filtered = chats;
  if (query) {
    filtered = chats.filter(c => {
      if ((c.title || '').toLowerCase().includes(query)) return true;
      return c.messages.some(m => (m.content || '').toLowerCase().includes(query));
    });
  }

  const pinned = filtered.filter(c => c.pinned).sort((a, b) => b.createdAt - a.createdAt);
  const others = filtered.filter(c => !c.pinned).sort((a, b) => b.createdAt - a.createdAt);

  if (pinned.length === 0 && others.length === 0) {
    list.innerHTML = `<p class="text-xs text-muted px-3 py-4 text-center">${query ? 'Tidak ada chat yang cocok.' : 'Belum ada riwayat chat'}</p>`;
    return;
  }

  if (pinned.length) {
    list.appendChild(historySectionLabel('Disematkan'));
    pinned.forEach(chat => list.appendChild(buildHistoryItem(chat)));
  }
  if (others.length) {
    if (pinned.length) list.appendChild(historySectionLabel('Lainnya'));
    others.forEach(chat => list.appendChild(buildHistoryItem(chat)));
  }

  if (window.lucide) lucide.createIcons();
}

function togglePinChat(id) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  chat.pinned = !chat.pinned;
  saveChatsToStorage();
  renderHistoryList();
}

function renameChat(id) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  const newTitle = prompt('Ganti judul chat:', chat.title || '');
  if (newTitle === null) return;
  const trimmed = newTitle.trim();
  if (!trimmed) return;
  chat.title = trimmed.slice(0, 80);
  saveChatsToStorage();
  renderHistoryList();
  if (id === currentChatId) {
    document.getElementById('chat-title').textContent = chat.title;
  }
}

/* ---------------------------------------------------------------------
   RENDER PESAN
   --------------------------------------------------------------------- */
function renderAttachmentsInMessage(attachments) {
  if (!attachments || !attachments.length) return '';
  const imgs = attachments.filter(a => a.type === 'image');
  const docs = attachments.filter(a => a.type === 'document');
  let html = '';
  if (imgs.length) {
    html += `<div class="flex flex-wrap gap-1.5 justify-end">${imgs.map(a =>
      `<img src="${a.dataUrl}" alt="${escapeHtml(a.name)}" class="w-20 h-20 object-cover rounded-lg border border-hairline" />`
    ).join('')}</div>`;
  }
  if (docs.length) {
    html += `<div class="flex flex-col gap-1 items-end">${docs.map(a =>
      `<span class="inline-flex items-center gap-1.5 text-xs bg-elevated border border-hairline rounded-full px-3 py-1 text-muted">
        <i data-lucide="file-text" class="w-3 h-3"></i>${escapeHtml(a.name)}
      </span>`
    ).join('')}</div>`;
  }
  return html;
}

function buildMessageEl(msg, index, chat) {
  const { role, content, attachments } = msg;
  const wrap = document.createElement('div');
  wrap.className = 'msg-enter flex gap-3 ' + (role === 'user' ? 'justify-end' : 'justify-start');

  if (role === 'user') {
    if (editingIndex === index) {
      wrap.innerHTML = `
        <div class="max-w-[85%] w-full flex flex-col gap-2 items-end">
          <textarea id="edit-textarea-${index}" class="w-full bg-white border border-accent rounded-2xl px-4 py-2.5 text-sm text-ink resize-none outline-none" rows="3">${escapeHtml(content)}</textarea>
          <div class="flex gap-2">
            <button type="button" data-action="cancel-edit" class="text-xs px-3 py-1.5 rounded-full border border-hairline text-muted hover:bg-elevated">Batal</button>
            <button type="button" data-action="save-edit" data-index="${index}" class="text-xs px-3 py-1.5 rounded-full bg-accent-deep text-white hover:bg-gold-ink">Simpan &amp; Kirim Ulang</button>
          </div>
        </div>`;
      return wrap;
    }

    const attachHtml = renderAttachmentsInMessage(attachments);
    wrap.innerHTML = `
      <div class="max-w-[80%] flex flex-col items-end gap-1.5">
        ${attachHtml}
        ${content ? `<div class="bg-tint border border-accent/30 rounded-2xl rounded-tr-md px-4 py-2.5 text-sm text-ink whitespace-pre-wrap break-words">${escapeHtml(content)}</div>` : ''}
        <button type="button" data-action="edit" data-index="${index}" class="msg-action-btn text-[11px] text-faint hover:text-accent-deep flex items-center gap-1 pr-1">
          <i data-lucide="pencil" class="w-3 h-3"></i>Edit
        </button>
      </div>`;
  } else {
    const bubble = document.createElement('div');
    bubble.className = 'max-w-[85%] min-w-0 flex gap-3';
    const isLastAssistant = index === chat.messages.length - 1;
    bubble.innerHTML = `
      ${assistantAvatarHtml()}
      <div class="min-w-0 flex-1">
        <div class="prose-chat min-w-0 text-sm pt-0.5">${renderMarkdownSafe(content)}</div>
        <div class="flex items-center gap-3 mt-1.5">
          <button type="button" data-action="copy" data-index="${index}" class="msg-action-btn text-[11px] text-faint hover:text-accent-deep flex items-center gap-1">
            <i data-lucide="copy" class="w-3 h-3"></i>Copy
          </button>
          ${isLastAssistant ? `
          <button type="button" data-action="regenerate" class="msg-action-btn text-[11px] text-faint hover:text-accent-deep flex items-center gap-1">
            <i data-lucide="refresh-cw" class="w-3 h-3"></i>Regenerate
          </button>` : ''}
        </div>
      </div>`;
    wrap.appendChild(bubble);
  }
  return wrap;
}

function renderMessages(scrollMode = 'bottom') {
  const chat = getCurrentChat();
  const welcome = document.getElementById('welcome-screen');
  const box = document.getElementById('messages');
  const title = document.getElementById('chat-title');
  const area = document.getElementById('scroll-area');

  const preservedScrollTop = scrollMode === 'stay' ? area.scrollTop : null;

  replySlot = null;

  if (!chat || chat.messages.length === 0) {
    welcome.classList.remove('hidden');
    box.classList.add('hidden');
    box.innerHTML = '';
    title.textContent = 'Chat Baru';
    return;
  }

  welcome.classList.add('hidden');
  box.classList.remove('hidden');
  box.innerHTML = '';
  title.textContent = chat.title || 'Chat Baru';

  chat.messages.forEach((msg, i) => box.appendChild(buildMessageEl(msg, i, chat)));
  enhanceCodeBlocks(box);

  if (editingIndex !== null) {
    const ta = document.getElementById(`edit-textarea-${editingIndex}`);
    if (ta) {
      ta.focus();
      ta.selectionStart = ta.selectionEnd = ta.value.length;
    }
  } else if (scrollMode === 'reply') {
    prepareReplyView(box);
  } else if (scrollMode === 'stay') {
    /* Jangan lompat ke bawah -> biarkan posisi scroll persis seperti
       sebelumnya (biasanya di awal balasan AI), user yang scroll sendiri
       kalau mau lihat kelanjutan/akhir jawaban. */
    if (preservedScrollTop !== null) area.scrollTop = preservedScrollTop;
  } else if (scrollMode === 'bottom') {
    scrollToBottom();
  }
}

/* Delegasi klik untuk tombol aksi per pesan (copy / edit / regenerate / simpan-edit) */
document.getElementById('messages').addEventListener('click', (e) => {
  const copyBtn = e.target.closest('[data-action="copy"]');
  if (copyBtn) {
    const chat = getCurrentChat();
    const idx = parseInt(copyBtn.dataset.index, 10);
    if (chat && chat.messages[idx]) copyTextToClipboard(chat.messages[idx].content, copyBtn);
    return;
  }
  const regenBtn = e.target.closest('[data-action="regenerate"]');
  if (regenBtn) { regenerateLastResponse(); return; }

  const editBtn = e.target.closest('[data-action="edit"]');
  if (editBtn) {
    if (isSending) return;
    editingIndex = parseInt(editBtn.dataset.index, 10);
    renderMessages();
    return;
  }
  const cancelEditBtn = e.target.closest('[data-action="cancel-edit"]');
  if (cancelEditBtn) { editingIndex = null; renderMessages(); return; }

  const saveEditBtn = e.target.closest('[data-action="save-edit"]');
  if (saveEditBtn) {
    const idx = parseInt(saveEditBtn.dataset.index, 10);
    const ta = document.getElementById(`edit-textarea-${idx}`);
    if (ta) saveEditedMessage(idx, ta.value);
    return;
  }
});

function copyTextToClipboard(text, btn) {
  navigator.clipboard.writeText(text || '').then(() => {
    if (!btn) return;
    const original = btn.innerHTML;
    btn.innerHTML = `<i data-lucide="check" class="w-3 h-3"></i>Disalin`;
    if (window.lucide) lucide.createIcons();
    setTimeout(() => { btn.innerHTML = original; if (window.lucide) lucide.createIcons(); }, 1500);
  }).catch(() => showError('Gagal menyalin ke clipboard.'));
}

function saveEditedMessage(index, newText) {
  const trimmed = (newText || '').trim();
  const chat = getCurrentChat();
  if (!chat) return;
  if (!trimmed) { editingIndex = null; renderMessages(); return; }

  const oldAttachments = chat.messages[index] ? chat.messages[index].attachments : [];
  chat.messages = chat.messages.slice(0, index);
  chat.messages.push({ role: 'user', content: trimmed, attachments: oldAttachments || [] });
  editingIndex = null;
  saveChatsToStorage();
  renderHistoryList();
  renderMessages('bottom');
  requestAssistantReply(chat);
}

async function regenerateLastResponse() {
  if (isSending) return;
  const chat = getCurrentChat();
  if (!chat || !chat.messages.length) return;
  if (chat.messages[chat.messages.length - 1].role === 'assistant') {
    chat.messages.pop();
  }
  saveChatsToStorage();
  renderMessages('bottom');
  await requestAssistantReply(chat);
}

function removeAttachment(id) {
  pendingAttachments = pendingAttachments.filter(a => a.id !== id);
  renderAttachmentPreviews();
}

function handleImageFiles(fileList) {
  let plannedImageCount = pendingAttachments.filter(a => a.type === 'image').length;

  Array.from(fileList || []).forEach(file => {
    if (!file.type.startsWith('image/')) {
      showError(`"${file.name}" bukan file gambar.`);
      return;
    }
    if (plannedImageCount >= MAX_IMAGES_PER_REQUEST) {
      showError(`Maksimal ${MAX_IMAGES_PER_REQUEST} gambar per pesan (batas model vision Groq saat ini).`);
      return;
    }
    if (file.size > MAX_IMAGE_BYTES) {
      showError(`Gambar "${file.name}" melebihi ${MAX_IMAGE_MB}MB.`);
      return;
    }
    plannedImageCount++;
    const reader = new FileReader();
    reader.onload = () => {
      pendingAttachments.push({ id: uid(), type: 'image', name: file.name, dataUrl: reader.result });
      renderAttachmentPreviews();
    };
    reader.onerror = () => showError(`Gagal membaca gambar "${file.name}".`);
    reader.readAsDataURL(file);
  });
}


async function extractPdfText(file) {
  if (!window.pdfjsLib) throw new Error('Pustaka pembaca PDF gagal dimuat.');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n\n';
    if (text.length > MAX_DOC_CHARS) break;
  }
  return text.slice(0, MAX_DOC_CHARS);
}

async function extractDocxText(file) {
  if (!window.mammoth) throw new Error('Pustaka pembaca DOCX gagal dimuat.');
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return (result.value || '').slice(0, MAX_DOC_CHARS);
}

async function extractDocumentText(file) {
  const name = file.name.toLowerCase();
  if (file.type === 'application/pdf' || name.endsWith('.pdf')) return extractPdfText(file);
  if (name.endsWith('.docx')) return extractDocxText(file);
  if (file.type.startsWith('text/') || name.endsWith('.txt')) {
    const text = await file.text();
    return text.slice(0, MAX_DOC_CHARS);
  }
  throw new Error('Format tidak didukung. Gunakan PDF, DOCX, atau TXT.');
}

async function handleDocFiles(fileList) {
  for (const file of Array.from(fileList || [])) {
    const tempId = uid();
    pendingAttachments.push({ id: tempId, type: 'document', name: file.name, text: '', loading: true });
    renderAttachmentPreviews();
    try {
      const text = await extractDocumentText(file);
      const att = pendingAttachments.find(a => a.id === tempId);
      if (att) {
        att.text = text;
        att.loading = false;
      }
    } catch (e) {
      console.error(e);
      pendingAttachments = pendingAttachments.filter(a => a.id !== tempId);
      showError(`Gagal membaca "${file.name}": ${e.message || 'kesalahan tak dikenal'}`);
    }
    renderAttachmentPreviews();
  }
}

/* Ubah satu pesan (dengan lampiran) menjadi format "content" untuk API.
   includeImages hanya boleh true untuk pesan TERBARU dalam konteks yang
   dikirim -> supaya jumlah gambar per request tidak pernah melebihi batas
   Groq (maks. 3 gambar/request), riwayat gambar yang lebih lama diganti jadi
   catatan teks biasa. */
function buildApiContent(msg, includeImages) {
  const attachments = msg.attachments || [];
  if (!attachments.length) return msg.content || '';

  let text = msg.content || '';
  const docs = attachments.filter(a => a.type === 'document');
  if (docs.length) {
    const docBlock = docs.map(d => `[Isi dokumen "${d.name}"]:\n${d.text}`).join('\n\n');
    text = docBlock + (text ? `\n\n---\n\nPertanyaan pengguna: ${text}` : '');
  }

  const images = attachments.filter(a => a.type === 'image');
  if (!images.length) return text;

  if (!includeImages) {
    const note = images.length === 1 ? '[1 gambar dilampirkan sebelumnya]' : `[${images.length} gambar dilampirkan sebelumnya]`;
    return text ? `${text}\n\n${note}` : note;
  }

  const limited = images.slice(0, MAX_IMAGES_PER_REQUEST);
  const parts = [{ type: 'text', text: text || '(lihat gambar terlampir)' }];
  limited.forEach(img => parts.push({ type: 'image_url', image_url: { url: img.dataUrl } }));
  return parts;
}

function stopGeneration() {
  if (currentAbortController) currentAbortController.abort();

function createStreamingAssistantEl() {
  const container = getReplyContainer();
  const wrap = document.createElement('div');
  wrap.className = 'msg-enter flex gap-3 justify-start';
  wrap.innerHTML = `
    <div class="max-w-[85%] min-w-0 flex gap-3">

/* Selalu menampilkan jawaban dengan efek "diketik" pelan-pelan, terlepas dari
   seberapa cepat/besar potongan data yang datang dari server. Groq sering
   membalas sangat cepat (bahkan seluruh jawaban bisa datang dalam satu
   potongan SSE atau satu respons JSON utuh), jadi kalau langsung
   ditampilkan apa adanya efeknya jadi "muncul semua sekaligus". Revealer ini
   memisahkan "teks yang sudah diterima" (full) dari "teks yang sedang
   ditampilkan" (displayed), lalu mengejar displayed -> full sedikit demi
   sedikit tiap tick, jadi animasi ketiknya konsisten baik untuk streaming
   asli maupun fallback non-streaming. */
function createRevealer(target) {
  const TICK_MS = 16;
  const MIN_CHUNK = 3;
  const CATCH_UP_DIVISOR = 22;

  let full = '';
  let displayed = '';
  let isDone = false;
  let timerId = null;
  let resolveWhenDone = null;
  const donePromise = new Promise((res) => { resolveWhenDone = res; });

  function tick() {
    const remaining = full.length - displayed.length;
    if (remaining > 0) {
      const chunk = Math.max(MIN_CHUNK, Math.ceil(remaining / CATCH_UP_DIVISOR));
      displayed = full.slice(0, displayed.length + chunk);
      target.textContent = displayed;
      scrollIfNearBottom();
    }
    if (displayed.length >= full.length && isDone) {
      timerId = null;
      resolveWhenDone();
      return;
    }
    timerId = setTimeout(tick, TICK_MS);
  }
  timerId = setTimeout(tick, TICK_MS);

  return {
    update(newFull) { full = newFull; },
    finish() { isDone = true; },
    skipToEnd() {
      if (timerId) { clearTimeout(timerId); timerId = null; }
      displayed = full;
      target.textContent = displayed;
      isDone = true;
      resolveWhenDone();
    },
    whenDone() { return donePromise; },
  };
}

function extractDeltaText(json) {
  return (
    json?.choices?.[0]?.delta?.content ??
    json?.choices?.[0]?.message?.content ??
    ''
  );
}

async function requestAssistantReply(chat) {
  clearError();
  isSending = true;
  currentAbortController = new AbortController();
  updateSendButtonUI();
  showTypingIndicator();

  let assistantWrap = null;
  let revealer = null;
  let accumulated = '';

  const onAbortSkip = () => { if (revealer) revealer.skipToEnd(); };
  currentAbortController.signal.addEventListener('abort', onAbortSkip);

  function ensureAssistantEl() {
    if (assistantWrap) return;
    removeTypingIndicator();
    const created = createStreamingAssistantEl();
    assistantWrap = created.wrap;
    revealer = createRevealer(created.target);
  }

  try {
    const historySlice = chat.messages.slice(-MAX_HISTORY_MESSAGES);
    const latestMsg = historySlice[historySlice.length - 1];
    const latestHasImage = !!(latestMsg && (latestMsg.attachments || []).some(a => a.type === 'image'));
    const requestModel = latestHasImage ? VISION_MODEL_ID : selectedModel;

    const contextMessages = [
      { role: 'system', content: SYSTEM_PROMPT },
      ...historySlice.map(m => ({ role: m.role, content: buildApiContent(m, m === latestMsg) })),
    ];

    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: requestModel,
        messages: contextMessages,
        stream: true,
      }),
      signal: currentAbortController.signal,
    });

    if (!response.ok) {
      const errText = await response.text().catch(() => '');
      throw new Error(`Worker merespons dengan status ${response.status}. ${errText ? '(' + errText.slice(0, 150) + ')' : ''}`);
    }

    let sawSSE = false;

    if (!response.body || !response.body.getReader) {
      const data = await response.json();
      accumulated = data?.choices?.[0]?.message?.content ?? data?.content ?? data?.message ?? '';
      if (accumulated) { ensureAssistantEl(); revealer.update(accumulated); }
    } else {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const rawLine of lines) {
          const line = rawLine.trim();
          if (!line || !line.startsWith('data:')) continue;
          sawSSE = true;
          const payload = line.slice(5).trim();
          if (payload === '[DONE]') continue;
          try {
            const json = JSON.parse(payload);
            const delta = extractDeltaText(json);
            if (delta) {
              accumulated += delta;
              ensureAssistantEl();
              revealer.update(accumulated);
            }
          } catch (e) { /* chunk tidak lengkap/tidak valid, abaikan */ }
        }
      }

      if (!sawSSE && buffer.trim()) {
        try {
          const json = JSON.parse(buffer);
          accumulated = json?.choices?.[0]?.message?.content ?? json?.content ?? json?.message ?? accumulated;
          if (accumulated) { ensureAssistantEl(); revealer.update(accumulated); }
        } catch (e) { /* bukan JSON lengkap, abaikan */ }
      }
    }

    if (!accumulated) {
      throw new Error('Format respons dari Worker tidak dikenali. Pastikan Worker mengembalikan field "choices[0].message.content" atau stream SSE yang kompatibel.');
    }

    revealer.finish();
    await revealer.whenDone();

    const proseEl = assistantWrap.querySelector('.prose-chat');
    proseEl.classList.remove('whitespace-pre-wrap');
    proseEl.innerHTML = renderMarkdownSafe(accumulated);
    enhanceCodeBlocks(assistantWrap);

    chat.messages.push({ role: 'assistant', content: accumulated, attachments: [] });
    saveChatsToStorage();
    renderHistoryList();
    renderMessages('stay');

  } catch (err) {
    removeTypingIndicator();
    if (err.name === 'AbortError') {
      if (revealer) revealer.skipToEnd();
      if (accumulated) {
        const finalText = accumulated + '\n\n_(dihentikan oleh pengguna)_';
        chat.messages.push({ role: 'assistant', content: finalText, attachments: [] });
        saveChatsToStorage();
        renderHistoryList();
        renderMessages('stay');
      } else if (assistantWrap) {
        assistantWrap.remove();
      }
    } else {
      console.error(err);
      if (assistantWrap) assistantWrap.remove();
      showError(
        err.message && err.message.includes('Failed to fetch')
          ? 'Tidak dapat terhubung ke Worker. Periksa URL Worker dan koneksi internet Anda.'
          : (err.message || 'Terjadi kesalahan tak terduga saat menghubungi Worker.')
      );
    }
  } finally {
    currentAbortController.signal.removeEventListener('abort', onAbortSkip);
    isSending = false;
    currentAbortController = null;
    updateSendButtonUI();
  }
}

async function handleSendMessage() {
  if (isSending) return;
  const input = document.getElementById('composer-input');
  const text = input.value.trim();
  if (!text && pendingAttachments.length === 0) return;

  clearError();

  if (!WORKER_URL || WORKER_URL === "MASUKKAN_URL_CLOUDFLARE_WORKER_DI_SINI") {
    showError('WORKER_URL belum diisi di dalam kode. Buka index.html dan tempelkan URL Cloudflare Worker Anda pada konstanta WORKER_URL di bagian atas skrip.');
    return;
  }

  if (pendingAttachments.some(a => a.loading)) {
    showError('Tunggu sebentar, dokumen masih diproses...');
    return;
  }

  const remain = cooldownRemaining();
  if (remain > 0) {
    showError(`Terlalu cepat. Mohon tunggu ${Math.ceil(remain / 1000)} detik lagi sebelum mengirim pesan berikutnya.`);
    return;
  }

  let chat = getCurrentChat();
  if (!chat) {
    chat = { id: uid(), title: '', model: selectedModel, messages: [], createdAt: Date.now(), pinned: false };
    chats.push(chat);
    currentChatId = chat.id;
  }

  if (!chat.title) {
    const fallbackTitle = pendingAttachments[0] ? pendingAttachments[0].name : 'Lampiran';
    const baseTitle = text || fallbackTitle;
    chat.title = baseTitle.length > 40 ? baseTitle.slice(0, 40) + '…' : baseTitle;
  }

  input.value = '';
  input.style.height = 'auto';

  const attachmentsForMsg = pendingAttachments.map(a => ({ ...a }));
  pendingAttachments = [];
  renderAttachmentPreviews();

  chat.messages.push({ role: 'user', content: text, attachments: attachmentsForMsg });
  lastSendAt = Date.now();
  saveChatsToStorage();
  renderHistoryList();
  renderMessages('reply');

  await requestAssistantReply(chat);
}

/* ---------------------------------------------------------------------
   INPUT SUARA (Web Speech API)
   --------------------------------------------------------------------- */
function initSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('mic-btn');
  if (!SR) {
    micBtn.disabled = true;
    micBtn.title = 'Input suara tidak didukung di browser ini';
    micBtn.classList.add('opacity-40', 'cursor-not-allowed');
    return;
  }
  recognition = new SR();
  recognition.lang = 'id-ID';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (e) => {
    const transcript = Array.from(e.results).map(r => r[0].transcript).join(' ');
    const input = document.getElementById('composer-input');
    input.value = (input.value ? input.value.trim() + ' ' : '') + transcript;
    input.dispatchEvent(new Event('input'));
    input.focus();
  };
  recognition.onerror = () => { isRecording = false; updateMicUI(); };
  recognition.onend = () => { isRecording = false; updateMicUI(); };

  micBtn.addEventListener('click', () => {
    if (isRecording) {
      recognition.stop();
    } else {
      clearError();
      try {
        recognition.start();
        isRecording = true;
        updateMicUI();
      } catch (e) { /* sudah berjalan, abaikan */ }
    }
  });
}

function updateMicUI() {
  const btn = document.getElementById('mic-btn');
  btn.classList.toggle('recording', isRecording);
  const icon = btn.querySelector('i');
  if (icon) icon.setAttribute('data-lucide', isRecording ? 'mic-off' : 'mic');
  if (window.lucide) lucide.createIcons();
}

/* ---------------------------------------------------------------------
   EKSPOR CHAT (.txt / .md)
   --------------------------------------------------------------------- */
function exportChat(format) {
  const chat = getCurrentChat();
  if (!chat || !chat.messages.length) {
    showError('Tidak ada percakapan untuk diekspor.');
    return;
  }
  let out = '';
  if (format === 'md') {
    out += `# ${chat.title || 'Chat'}\n\n`;
    chat.messages.forEach(m => {
      out += `**${m.role === 'user' ? 'Anda' : 'BAS.ai'}:**\n\n${m.content || ''}\n\n---\n\n`;
    });
  } else {
    out += `${chat.title || 'Chat'}\n${'='.repeat((chat.title || 'Chat').length)}\n\n`;
    chat.messages.forEach(m => {
      out += `${m.role === 'user' ? 'Anda' : 'BAS.ai'}:\n${m.content || ''}\n\n`;
    });
  }
  const blob = new Blob([out], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const safeName = (chat.title || 'chat').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'chat';
  a.download = `${safeName}.${format}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById('export-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('export-dropdown').classList.toggle('hidden');
});
document.querySelectorAll('.export-option').forEach(btn => {
  btn.addEventListener('click', () => {
    exportChat(btn.dataset.format);
    document.getElementById('export-dropdown').classList.add('hidden');
  });
});

document.addEventListener('click', () => {
  document.getElementById('model-dropdown').classList.add('hidden');
  document.getElementById('export-dropdown').classList.add('hidden');
});

/* ---------------------------------------------------------------------
   TEMA TERANG / GELAP
   --------------------------------------------------------------------- */
function updateThemeIcon() {
  const isDark = document.documentElement.classList.contains('dark');
  const icon = document.getElementById('theme-icon');
  icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
  if (window.lucide) lucide.createIcons();
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', isDark ? '#14120F' : '#FFFFFF');
}

function toggleTheme() {
  document.documentElement.classList.toggle('dark');
  const isDark = document.documentElement.classList.contains('dark');
  localStorage.setItem(STORAGE_KEY_THEME, isDark ? 'dark' : 'light');
  updateThemeIcon();
}

function initTheme() {
  const saved = localStorage.getItem(STORAGE_KEY_THEME);
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (saved === 'dark' || (!saved && prefersDark)) {
    document.documentElement.classList.add('dark');
  }
  updateThemeIcon();
}

document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);

function renderSuggestions() {
  const grid = document.getElementById('suggestion-grid');
  grid.innerHTML = '';
  SUGGESTIONS.forEach(s => {
    const card = document.createElement('button');
    card.className = 'suggestion-card text-left flex items-start gap-2.5 p-3.5 rounded-xl border border-hairline bg-white transition-colors';
    card.innerHTML = `
      <i data-lucide="${s.icon}" class="w-4 h-4 text-accent-deep mt-0.5 shrink-0"></i>
      <span class="text-xs text-ink leading-relaxed">${escapeHtml(s.text)}</span>`;
    card.addEventListener('click', () => {
      document.getElementById('composer-input').value = s.text;
      handleSendMessage();
    });
    grid.appendChild(card);
  });
  if (window.lucide) lucide.createIcons();
}

function renderModelDropdown() {
  const dropdown = document.getElementById('model-dropdown');
  dropdown.innerHTML = '';
  AVAILABLE_MODELS.forEach(m => {
    const item = document.createElement('button');
    item.className = 'w-full text-left px-3.5 py-2.5 hover:bg-surface flex flex-col gap-0.5 transition-colors' +
      (m.id === selectedModel ? ' bg-surface' : '');
    item.innerHTML = `
      <span class="text-xs font-medium text-ink flex items-center gap-1.5">
        ${m.id === selectedModel ? '<i data-lucide="check" class="w-3.5 h-3.5 text-accent-deep"></i>' : '<span class="w-3.5"></span>'}
        ${escapeHtml(m.label)}
      </span>
      <span class="text-[11px] text-muted pl-5">${escapeHtml(m.desc)}</span>`;
    item.addEventListener('click', () => {
      selectedModel = m.id;
      localStorage.setItem(STORAGE_KEY_MODEL, selectedModel);
      document.getElementById('model-label').textContent = m.id;
      dropdown.classList.add('hidden');
      renderModelDropdown();
    });
    dropdown.appendChild(item);
  });
  if (window.lucide) lucide.createIcons();
}

function showTypingIndicator() {
  const container = getReplyContainer();
  const el = document.createElement('div');
  el.id = 'typing-indicator';
  el.className = 'msg-enter flex gap-3 justify-start';
  el.innerHTML = `
    ${assistantAvatarHtml()}
    <div class="flex items-center gap-1.5 px-1 py-3">
      <span class="typing-dot w-1.5 h-1.5 rounded-full bg-accent"></span>
      <span class="typing-dot w-1.5 h-1.5 rounded-full bg-accent"></span>
      <span class="typing-dot w-1.5 h-1.5 rounded-full bg-accent"></span>
    </div>`;
  container.appendChild(el);
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function createNewChat() {
  const chat = { id: uid(), title: '', model: selectedModel, messages: [], createdAt: Date.now(), pinned: false };
  chats.push(chat);
  currentChatId = chat.id;
  pendingAttachments = [];
  editingIndex = null;
  renderAttachmentPreviews();
  saveChatsToStorage();
  renderHistoryList();
  renderMessages();
  closeSidebarOnMobile();
  document.getElementById('composer-input').focus();
}

function switchToChat(id) {
  if (isSending) stopGeneration();
  currentChatId = id;
  editingIndex = null;
  pendingAttachments = [];
  renderAttachmentPreviews();
  const chat = getCurrentChat();
  if (chat) selectedModel = chat.model || selectedModel;
  document.getElementById('model-label').textContent = selectedModel;
  renderHistoryList();
  renderMessages();
  closeSidebarOnMobile();
}

function deleteChat(id) {
  chats = chats.filter(c => c.id !== id);
  saveChatsToStorage();
  if (currentChatId === id) {
    currentChatId = chats.length ? chats[0].id : null;
    if (!currentChatId) createNewChat();
  }
  renderHistoryList();
  renderMessages();
}

function closeSidebarOnMobile() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.add('hidden');
}

function showError(message) {
  const banner = document.getElementById('error-banner');
  banner.innerHTML = `<i data-lucide="alert-triangle" class="w-4 h-4 shrink-0 mt-0.5"></i><span>${escapeHtml(message)}</span>`;
  banner.classList.remove('hidden');
  if (window.lucide) lucide.createIcons();
}

function clearError() {
  document.getElementById('error-banner').classList.add('hidden');
}

document.getElementById('new-chat-btn').addEventListener('click', createNewChat);

function init() {
  document.querySelectorAll('img[data-logo]').forEach(img => { img.src = LOGO_SRC; });

  if (window.lucide) lucide.createIcons();
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  initTheme();
  initSpeechRecognition();

  loadChatsFromStorage();
  selectedModel = localStorage.getItem(STORAGE_KEY_MODEL) || AVAILABLE_MODELS[0].id;
  document.getElementById('model-label').textContent = selectedModel;

  renderModelDropdown();
  renderSuggestions();
  renderAttachmentPreviews();
  updateSendButtonUI();

  if (chats.length > 0) {
    currentChatId = [...chats].sort((a, b) => b.createdAt - a.createdAt)[0].id;
  } else {
    currentChatId = null;
  }

  renderHistoryList();
  renderMessages();

  /* Registrasi Service Worker untuk PWA (Tambah ke Layar Utama + offline
     shell). Pastikan manifest.json, sw.js, icon-192.png, dan icon-512.png
     berada satu folder dengan index.html ini serta dilayani lewat
     http(s), bukan dibuka langsung dari file://. */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('Registrasi Service Worker gagal:', err));
    });
  }
}

init();
</script>
